# Production setup for a VPS that already runs Pangolin (https://github.com/fosrl/pangolin).
# Pangolin terminates HTTPS and proxies to this container over its Docker network.
#
# .env next to this file:
#   NUXT_PUBLIC_SITE_URL=https://example.com
#   PANGOLIN_NETWORK=pangolin   # optional, see `docker network ls`
#
# In Pangolin, create a resource for your domain with target
#   http://portfolio:3000
services:
  app:
    image: ghcr.io/raigen/vue-playground:latest
    build: .
    container_name: portfolio
    restart: unless-stopped
    environment:
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:?set NUXT_PUBLIC_SITE_URL in .env}
    # No published ports: only Pangolin reaches the app, via the shared network.
    expose:
      - '3000'
    networks:
      - pangolin

networks:
  pangolin:
    name: ${PANGOLIN_NETWORK:-pangolin}
    external: true
